name: headroom
description: "Get a thought out of your head in seconds."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: any
  pasteboard: ^0.5.0
  path_provider: ^2.1.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    # Recursive 1.085 with MONO, slnt and CRSV pinned to 0 and wght cut to
    # 300-700 (fontTools instancer), which divides its size by four.
    - family: Recursive
      fonts:
        - asset: assets/fonts/Recursive.ttf
